<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7657f6">
  <title>ChabChat — your people, all in one place</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211d35;background:#f4f3f8;font-synthesis:none;text-rendering:optimizeLegibility;--purple:#7657f6;--ink:#211d35;--muted:#9290a3;--line:#efedf4;--soft:#f7f6fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 10% 0%,#ece7ff 0,transparent 35%),#f4f3f8}button,input{font:inherit}button{cursor:pointer}.app{max-width:1440px;height:min(900px,calc(100vh - 48px));min-height:620px;margin:auto;background:#fff;border:1px solid #eeecf2;border-radius:26px;box-shadow:0 24px 80px #33235b12;display:grid;grid-template-columns:74px 340px minmax(0,1fr);overflow:hidden}.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:22px}.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#8b6aff,#6243ea);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;box-shadow:0 8px 18px #7657f642}.rail-nav{display:grid;gap:12px;margin-top:18px}.rail-btn{position:relative;width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:#aaa7b8;font-size:19px;transition:.2s}.rail-btn:hover,.rail-btn.active{background:#f0edff;color:var(--purple)}.rail-btn.active:before{content:"";position:absolute;left:-15px;top:11px;width:3px;height:22px;border-radius:4px;background:var(--purple)}.rail-spacer{flex:1}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee}.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.side-head{padding:27px 24px 16px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--purple);font-weight:800}.title-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.title-row h1{font-size:27px;letter-spacing:-1px;margin:0}.icon-btn{width:38px;height:38px;border:0;border-radius:12px;background:var(--soft);color:#777386;font-size:18px}.search-wrap{padding:0 20px 16px;position:relative}.search-wrap span{position:absolute;left:34px;top:11px;color:#a6a3b2}.search{width:100%;height:42px;border:1px solid transparent;outline:none;border-radius:13px;background:#f7f6fa;padding:0 12px 0 38px;color:var(--ink)}.search:focus{border-color:#d8d0ff;background:#fff}.stories{padding:0 20px 17px;border-bottom:1px solid var(--line)}.section-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-row strong{font-size:13px}.section-row button{border:0;background:none;color:var(--purple);font-size:12px;font-weight:700}.story-list{display:flex;gap:13px;overflow:auto;scrollbar-width:none}.story{min-width:49px;text-align:center;border:0;background:none;padding:0;color:var(--muted);font-size:10px}.story-ring{width:48px;height:48px;border-radius:50%;padding:2px;background:linear-gradient(140deg,#fa8b6b,#8157fa);display:block;margin:0 auto 5px}.story-ring img{width:100%;height:100%;border:2px solid white;border-radius:50%;object-fit:cover}.story.add .story-ring{background:#f0edff;position:relative}.story.add .story-ring:after{content:"+";position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border:2px solid white;border-radius:50%;display:grid;place-items:center;background:var(--purple);color:white;font-size:14px}.chat-list{overflow:auto;padding:8px 11px}.chat-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;border-radius:15px;background:#fff;text-align:left;color:inherit}.chat-item:hover{background:#faf9fc}.chat-item.active{background:#f4f1ff}.chat-avatar{width:48px;height:48px;flex:none;border-radius:50%;object-fit:cover;background:#eee}.chat-meta{flex:1;min-width:0}.chat-name-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.chat-name{font-weight:700;font-size:13px}.chat-time{color:#aaa7b7;font-size:10px;white-space:nowrap}.chat-preview{display:block;color:var(--muted);font-size:11px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.unread{background:var(--purple);color:white;border-radius:20px;min-width:18px;height:18px;display:grid;place-items:center;font-size:10px;padding:0 5px}.main{display:flex;flex-direction:column;min-width:0;background:#fff}.chat-header{height:82px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);gap:13px}.back-btn{display:none;border:0;background:none;font-size:22px;color:var(--ink)}.header-avatar{width:43px;height:43px;border-radius:50%;object-fit:cover}.header-person{flex:1}.header-person strong{display:block;font-size:14px}.online{display:flex;align-items:center;gap:5px;margin-top:4px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#42c990}.header-actions{display:flex;gap:9px}.header-actions .icon-btn{background:white;border:1px solid var(--line)}.conversation{flex:1;overflow:auto;padding:24px clamp(18px,5vw,68px);background:linear-gradient(#fff,#fdfcff)}.day-divider{text-align:center;color:#aaa7b7;font-size:10px;margin:5px 0 23px}.message-row{display:flex;align-items:flex-end;gap:9px;margin:13px 0}.message-row.mine{justify-content:flex-end}.mini-avatar{width:27px;height:27px;border-radius:50%;object-fit:cover}.bubble-wrap{max-width:min(70%,440px)}.bubble{padding:12px 15px;border-radius:17px 17px 17px 5px;background:#f2f1f6;color:#413e50;font-size:13px;line-height:1.55}.mine .bubble{background:linear-gradient(135deg,#8668fa,#7050ed);color:#fff;border-radius:17px 17px 5px 17px}.message-time{font-size:9px;color:#aaa7b7;margin-top:5px}.mine .message-time{text-align:right}.photo-card{padding:5px;background:#f2f1f6;border-radius:16px;max-width:245px}.photo-card img{display:block;width:100%;height:175px;object-fit:cover;border-radius:12px}.photo-caption{font-size:12px;padding:7px 7px 4px;color:#4d495d}.composer-wrap{padding:15px 26px 20px;border-top:1px solid var(--line)}.composer{display:flex;align-items:center;gap:10px;padding:7px 9px 7px 14px;background:#f7f6fa;border-radius:16px}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;color:var(--ink)}.composer input::placeholder{color:#aaa7b7}.attach{border:0;background:transparent;color:#918da1;font-size:18px;width:30px}.send{width:38px;height:38px;border:0;border-radius:12px;background:var(--purple);color:white;font-size:17px;box-shadow:0 5px 12px #7657f633}.composer-hint{text-align:center;color:#b1aebb;font-size:9px;margin-top:9px}.empty-state{margin:auto;text-align:center;color:var(--muted);padding:30px}.empty-state .big{font-size:42px}.empty-state h2{color:var(--ink)}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#29243c;color:white;border-radius:12px;padding:11px 16px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:850px){body{padding:0}.app{height:100vh;min-height:0;border:0;border-radius:0;grid-template-columns:64px 300px minmax(0,1fr)}.side-head{padding:22px 18px 14px}.search-wrap{padding-left:15px;padding-right:15px}.search-wrap span{left:29px}.stories{padding-left:15px;padding-right:15px}.chat-header{padding:0 17px}.conversation{padding-left:20px;padding-right:20px}}
    @media(max-width:650px){.app{grid-template-columns:58px minmax(0,1fr)}.side{border-right:0}.main{display:none}.app.chat-open .side{display:none}.app.chat-open .main{display:flex;grid-column:2}.back-btn{display:block}.chat-header{height:72px;padding:0 12px;gap:8px}.header-actions{gap:4px}.header-actions .icon-btn{width:34px;height:34px}.conversation{padding:20px 13px}.bubble-wrap{max-width:82%}.composer-wrap{padding:12px}.side-head{padding:20px 15px 14px}.title-row h1{font-size:24px}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" aria-label="Main navigation">
      <div class="logo" title="ChabChat">c.</div>
      <nav class="rail-nav">
        <button class="rail-btn active" data-view="Chats" aria-label="Chats" title="Chats">◉</button>
        <button class="rail-btn" data-view="Stories" aria-label="Stories" title="Stories">◎</button>
        <button class="rail-btn" data-view="Explore" aria-label="Explore" title="Explore">⌕</button>
        <button class="rail-btn" data-view="Saved" aria-label="Saved" title="Saved">♡</button>
      </nav>
      <div class="rail-spacer"></div>
      <button class="rail-btn" id="settings" aria-label="Settings" title="Settings">⚙</button>
      <img class="avatar" src="https://i.pravatar.cc/80?img=12" alt="Your profile">
    </aside>
    <aside class="side">
      <div class="side-head"><div class="eyebrow">Your little corner</div><div class="title-row"><h1 id="page-title">Messages</h1><button class="icon-btn" id="new-chat" aria-label="New chat" title="New chat">＋</button></div></div>
      <div class="search-wrap"><span>⌕</span><input id="search" class="search" type="search" placeholder="Search people or messages…" aria-label="Search chats"></div>
      <section class="stories"><div class="section-row"><strong>Stories</strong><button id="all-stories">See all</button></div><div class="story-list" id="story-list"></div></section>
      <div class="section-row" style="padding:16px 21px 4px;margin:0"><strong id="list-heading">Recent chats</strong><button id="filter-btn">•••</button></div>
      <div class="chat-list" id="chat-list"></div>
    </aside>
    <main class="main" id="main-panel">
      <header class="chat-header" id="chat-header"></header>
      <section class="conversation" id="conversation" aria-live="polite"></section>
      <div class="composer-wrap"><form class="composer" id="composer"><button type="button" class="attach" id="attach" aria-label="Add attachment">＋</button><input id="message-input" autocomplete="off" placeholder="Write a message…" aria-label="Write a message"><button class="send" aria-label="Send message">➤</button></form><div class="composer-hint">Good conversations start with a hello ✨</div></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const people=[
      {id:'maya',name:'Maya Chen',img:1,status:'Online now',time:'2m',unread:2,preview:'That sunset was unreal 🌅',messages:[{text:'Hey! Did you get home okay?',time:'10:24',mine:false},{text:'Yep, just got in. Thanks for a lovely afternoon!',time:'10:26',mine:true},{text:'I sent you the photos from the beach 📸',time:'10:27',mine:false},{photo:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop',caption:'Our little escape 🌊',time:'10:27',mine:false},{text:'That sunset was unreal 🌅',time:'10:29',mine:false}]},
      {id:'leo',name:'Leo Martin',img:11,status:'Active 8 min ago',time:'18m',unread:0,preview:'You: Haha absolutely 😂',messages:[{text:'Are we still on for coffee this week?',time:'09:40',mine:false},{text:'Definitely! Thursday works for me ☕',time:'09:45',mine:true},{text:'You: Haha absolutely 😂',time:'10:02',mine:true}]},
      {id:'sophie',name:'Sophie Williams',img:47,status:'Online now',time:'1h',unread:1,preview:'Voice message · 0:12',messages:[{text:'I found the cutest little bookshop downtown!',time:'Yesterday',mine:false},{text:'We have to go this weekend 📚',time:'Yesterday',mine:true}]},
      {id:'weekend',name:'Weekend crew',img:5,status:'4 people',time:'2h',unread:0,preview:'Noah: I’ll bring snacks 🍿',group:true,messages:[{text:'Saturday picnic at the park?',time:'11:15',mine:false},{text:'I’ll bring snacks 🍿',time:'11:22',mine:false}]},
      {id:'noah',name:'Noah Brooks',img:60,status:'Active yesterday',time:'1d',unread:0,preview:'That playlist is so good',messages:[{text:'That playlist is so good 🎶',time:'Yesterday',mine:false}]},
      {id:'ava',name:'Ava Patel',img:44,status:'Active yesterday',time:'1d',unread:0,preview:'Shared a story',messages:[{text:'Shared a story with you ✨',time:'Yesterday',mine:false}]}
    ];
    const stories=[['You',12,true],['Maya',1],['Leo',11],['Sophie',47],['Noah',60],['Ava',44]];
    let selected='maya',currentView='Chats';
    const app=document.getElementById('app'), list=document.getElementById('chat-list'),conversation=document.getElementById('conversation'),header=document.getElementById('chat-header'),search=document.getElementById('search');
    const avatarUrl=(n)=>`https://i.pravatar.cc/100?img=${n}`;
    function renderStories(){document.getElementById('story-list').innerHTML=stories.map(([name,img,add])=>`<button class="story ${add?'add':''}" data-story="${name}"><span class="story-ring"><img src="${avatarUrl(img)}" alt=""></span>${name}</button>`).join('');}
    function renderList(){const term=search.value.toLowerCase();const found=people.filter(p=>(p.name+' '+p.preview).toLowerCase().includes(term));list.innerHTML=found.length?found.map(p=>`<button class="chat-item ${p.id===selected?'active':''}" data-id="${p.id}"><img class="chat-avatar" src="${avatarUrl(p.img)}" alt=""><span class="chat-meta"><span class="chat-name-row"><span class="chat-name">${p.name}</span><span class="chat-time">${p.time}</span></span><span class="chat-preview">${p.preview}</span></span>${p.unread?`<span class="unread">${p.unread}</span>`:''}</button>`).join(''):'<div class="empty-state">No conversations found.</div>';}
    function renderChat(){const p=people.find(x=>x.id===selected);if(!p)return;header.innerHTML=`<button class="back-btn" id="back" aria-label="Back to chats">‹</button><img class="header-avatar" src="${avatarUrl(p.img)}" alt=""><div class="header-person"><strong>${p.name}</strong><span class="online"><i class="dot" style="background:${p.status==='Online now'?'#42c990':'#c6c3cf'}"></i>${p.status}</span></div><div class="header-actions"><button class="icon-btn" data-action="Call" aria-label="Call">♧</button><button class="icon-btn" data-action="Video call" aria-label="Video call">▣</button><button class="icon-btn" data-action="More options" aria-label="More options">•••</button></div>`;
      conversation.innerHTML='<div class="day-divider">TODAY</div>'+p.messages.map(m=>`<div class="message-row ${m.mine?'mine':''}">${!m.mine?`<img class="mini-avatar" src="${avatarUrl(p.img)}" alt="">`:''}<div class="bubble-wrap">${m.photo?`<div class="photo-card"><img src="${m.photo}" alt="Shared beach photo"><div class="photo-caption">${m.caption}</div></div>`:`<div class="bubble">${escapeHtml(m.text)}</div>`}<div class="message-time">${m.time}${m.mine?' · ✓✓':''}</div></div></div>`).join('');conversation.scrollTop=conversation.scrollHeight;renderList();}
    function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2100);}
    list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;selected=b.dataset.id;renderChat();if(innerWidth<=650)app.classList.add('chat-open');});
    search.addEventListener('input',renderList);
    document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('message-input'),text=input.value.trim();if(!text)return;const p=people.find(x=>x.id===selected);const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});p.messages.push({text,time:now,mine:true});p.preview='You: '+text;p.time='now';input.value='';renderChat();});
    document.addEventListener('click',e=>{const story=e.target.closest('[data-story]');if(story)toast(story.dataset.story==='You'?'Share a moment with your friends!':`${story.dataset.story}’s story — coming right up!`);const action=e.target.closest('[data-action]');if(action)toast(`${action.dataset.action} is coming soon`);});
    document.getElementById('back').addEventListener('click',()=>app.classList.remove('chat-open'));
    document.getElementById('all-stories').addEventListener('click',()=>toast('You’re all caught up on stories!'));
    document.getElementById('new-chat').addEventListener('click',()=>{search.focus();toast('Search for a friend to start chatting');});
    document.getElementById('attach').addEventListener('click',()=>toast('Photo and file sharing is coming soon'));
    document.getElementById('filter-btn').addEventListener('click',()=>toast('You’re viewing your recent chats'));
    document.getElementById('settings').addEventListener('click',()=>toast('Settings are coming soon'));
    document.querySelectorAll('.rail-btn[data-view]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.rail-btn[data-view]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');currentView=btn.dataset.view;document.getElementById('page-title').textContent=currentView==='Chats'?'Messages':currentView;document.getElementById('list-heading').textContent=currentView==='Chats'?'Recent chats':currentView==='Stories'?'Friends’ stories':`${currentView} preview`;toast(currentView==='Chats'?'Your conversations':`${currentView} is coming soon`);}));
    renderStories();renderList();renderChat();if(innerWidth<=650)app.classList.remove('chat-open');
  </script>
</body>
</html>
